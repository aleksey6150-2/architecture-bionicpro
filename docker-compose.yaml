services:
  keycloak_db:
    image: postgres:14
    environment:
      POSTGRES_DB: keycloak_db
      POSTGRES_USER: keycloak_user
      POSTGRES_PASSWORD: keycloak_password
    volumes:
      - ./postgres-keycloak-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
  keycloak:
    image: quay.io/keycloak/keycloak:21.1
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak_db:5432/keycloak_db
      KC_DB_USERNAME: keycloak_user
      KC_DB_PASSWORD: keycloak_password
    command:
      - start-dev
      - --import-realm
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    ports:
      - "8080:8080"
    depends_on:
      - keycloak_db
      - openldap
  openldap:
    image: osixia/openldap:1.5.0
    container_name: openldap
    command: --copy-service
    volumes:
      - ./ldap/config.ldif:/container/service/slapd/assets/config/bootstrap/ldif/50-bootstrap.ldif
    environment:
      LDAP_ORGANISATION: BionicPRO
      LDAP_DOMAIN: example.com
      LDAP_ADMIN_PASSWORD: admin
    ports:
      - "389:389"
      - "636:636"
  redis:
    image: redis:7-alpine
    container_name: bionicpro-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      REACT_APP_BFF_URL: http://localhost:9000

  # =====================================================
  # Часть 2: данные и отчёты
  # =====================================================

  source-db:
    image: postgres:16
    container_name: bionicpro-source-db
    # wal_level=logical + max_replication_slots — обязательное для Debezium
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_wal_senders=10"
      - "-c"
      - "max_replication_slots=10"
    environment:
      POSTGRES_DB: source
      POSTGRES_USER: source
      POSTGRES_PASSWORD: source
    volumes:
      - ./source-db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5434:5432"

  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    container_name: bionicpro-clickhouse
    environment:
      CLICKHOUSE_DB: bionicpro_olap
      CLICKHOUSE_USER: ch
      CLICKHOUSE_PASSWORD: ch
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - ./clickhouse:/docker-entrypoint-initdb.d
    ports:
      - "8123:8123"
      - "9001:9000"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  airflow:
    image: apache/airflow:2.10.4
    container_name: bionicpro-airflow
    command: standalone
    depends_on:
      - source-db
      - clickhouse
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
      _PIP_ADDITIONAL_REQUIREMENTS: "clickhouse-driver==0.2.9 psycopg2-binary==2.9.10"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - airflow-data:/opt/airflow
    ports:
      - "8082:8080"

  reports-api:
    build:
      context: ./backend/reports-api
      dockerfile: Dockerfile
    container_name: bionicpro-reports-api
    depends_on:
      - clickhouse
      - keycloak
      - minio
    environment:
      CLICKHOUSE_URL: jdbc:clickhouse://clickhouse:8123/bionicpro_olap?compress=0
      CLICKHOUSE_USER: ch
      CLICKHOUSE_PASSWORD: ch
      KEYCLOAK_JWKS_URI: http://keycloak:8080/realms/reports-realm/protocol/openid-connect/certs
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minio_user
      MINIO_SECRET_KEY: minio_password
      MINIO_BUCKET: reports-bucket
      # URL, который будет в ответе клиенту — CDN перед Minio
      CDN_BASE_URL: http://localhost:9080
    ports:
      - "8000:8000"

  # =====================================================
  # Часть 3: S3-объектное хранилище + CDN
  # =====================================================

  minio:
    image: minio/minio:latest
    container_name: bionicpro-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio_user
      MINIO_ROOT_PASSWORD: minio_password
    volumes:
      - minio-data:/data
    ports:
      - "9090:9000"   # S3 API наружу
      - "9091:9001"   # Web console

  # Одноразовый init: создаёт bucket и открывает public read
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc alias set local http://minio:9000 minio_user minio_password >/dev/null 2>&1; do
        sleep 1;
      done;
      /usr/bin/mc mb -p local/reports-bucket || true;
      /usr/bin/mc anonymous set download local/reports-bucket;
      echo 'Bucket reports-bucket ready';
      "
    restart: "no"

  cdn:
    image: nginx:1.27-alpine
    container_name: bionicpro-cdn
    depends_on:
      - minio
    volumes:
      - ./cdn/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - cdn-cache:/var/cache/nginx
    ports:
      - "9080:80"

  # =====================================================
  # Часть 4: CDC — Debezium → Kafka → ClickHouse KafkaEngine
  # =====================================================

  kafka:
    image: apache/kafka:3.8.0
    container_name: bionicpro-kafka
    # Apache KRaft (без Zookeeper), single-node
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
    ports:
      - "9092:9092"

  kafka-connect:
    # Docker Hub mirror у debezium иногда отваливается с EOF, quay.io стабильнее
    image: quay.io/debezium/connect:2.7.3.Final
    container_name: bionicpro-kafka-connect
    depends_on:
      - kafka
      - source-db
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: bionicpro-connect-cluster
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      STATUS_STORAGE_REPLICATION_FACTOR: "1"
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
    ports:
      - "8083:8083"

  # Одноразовая регистрация Debezium-коннектора в Kafka Connect
  kafka-connect-init:
    image: curlimages/curl:8.10.1
    depends_on:
      - kafka-connect
    volumes:
      - ./debezium:/debezium:ro
    entrypoint: >
      /bin/sh -c "
      until curl -sf http://kafka-connect:8083/ >/dev/null 2>&1; do
        echo 'Waiting for Kafka Connect...';
        sleep 5;
      done;
      echo 'Kafka Connect ready, registering connector...';
      curl -sS -X PUT -H 'Content-Type: application/json'
        --data @/debezium/crm-connector.json
        http://kafka-connect:8083/connectors/crm-connector/config;
      echo;
      echo 'Connector registered';
      "
    restart: "no"

volumes:
  airflow-data: {}
  minio-data: {}
  cdn-cache: {}
