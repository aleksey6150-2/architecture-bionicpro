server:
  port: 9000
  servlet:
    session:
      cookie:
        name: SESSION
        http-only: true
        secure: false       # включить в проде с HTTPS
        same-site: lax
      timeout: 30m

spring:
  application:
    name: bionicpro-auth

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  session:
    store-type: redis
    redis:
      namespace: bionicpro:session
      flush-mode: on-save

  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: bionicpro-auth
            client-secret: ${KEYCLOAK_CLIENT_SECRET:bionicpro-auth-secret-change-me}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - openid
              - profile
              - email
            client-authentication-method: client_secret_post
        provider:
          keycloak:
            issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8080/realms/reports-realm}
            user-name-attribute: preferred_username

bionicpro:
  auth:
    token-encryption:
      # 32 байта для AES-256-GCM; в проде из секрет-стора
      key: ${TOKEN_ENCRYPTION_KEY:CHANGE_ME_32_BYTE_AES_256_GCM_KEY!!}
    session:
      rotation:
        enabled: true
        grace-period: 10s
    upstream:
      reports-api: ${REPORTS_API_URL:http://localhost:8000}

logging:
  level:
    org.springframework.security: INFO
    com.bionicpro.auth: DEBUG
