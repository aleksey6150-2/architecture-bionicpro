# Эмуляция CDN перед Minio: reverse proxy с агрессивным кешированием
# отчётов. Ключи отчётов в S3 версионированы по watermark-дате, поэтому
# при появлении новых данных URL меняется и кеш для старого URL остаётся
# нетронутым (LRU выселит со временем).

proxy_cache_path /var/cache/nginx
                 levels=1:2
                 keys_zone=reports_cache:10m
                 max_size=512m
                 inactive=24h
                 use_temp_path=off;

server {
    listen 80 default_server;
    server_name _;

    # Стандартный health-check для самого CDN
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        # Один и тот же URL → один cache-entry.
        proxy_cache reports_cache;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        proxy_cache_valid 200 24h;
        proxy_cache_valid 404 1m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        proxy_cache_revalidate on;

        # Прячем CORS-заголовки от Minio, иначе получаем дубли
        # (две ACAO, плюс Allow-Credentials:true с нашим *).
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Expose-Headers;
        proxy_hide_header Vary;

        # Видимость для отладки
        add_header X-Cache-Status $upstream_cache_status always;
        add_header X-Served-By "bionicpro-cdn" always;

        # CORS — фронт на :3000 fetch'ит CDN на :9080
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;

        # Под капотом — Minio
        proxy_pass http://minio:9000/reports-bucket/;
        proxy_set_header Host minio:9000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}
